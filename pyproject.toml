[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bertuner"
version = "0.1.0"
description = "Hyperparameter optimization and fine-tuning for BERT-style text classifiers (Optuna + MLflow), with long-context ModernBERT support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "elemets", email = "alafunnell@gmail.com" }]
keywords = [
    "bert",
    "modernbert",
    "text-classification",
    "transformers",
    "hyperparameter-optimization",
    "optuna",
    "mlflow",
    "fine-tuning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Inference-only footprint; training pulls the [train] extra
dependencies = [
    "torch>=2.0",
    "transformers>=4.48",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
train = [
    "optuna>=3.0",
    "mlflow>=2.9",
    "datasets>=2.14",
    "tensorboard>=2.15",
    "accelerate>=0.26",
]
dev = ["pytest>=7.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/elemets/bertuner"
Repository = "https://github.com/elemets/bertuner"
Issues = "https://github.com/elemets/bertuner/issues"

[tool.setuptools]
packages = ["bertuner"]
